<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicaragua – red de oportunidades</title>
<style>
  /* Solo para esta demo; en tu web no hace falta */
  html,body{box-sizing:border-box;margin:0;background:transparent;overflow:hidden}
  body{padding:3vmin;display:grid;place-items:center;width:100%;min-height:100vh;min-height:100dvh}

  #mapa-nodos{
    --c1:#0ea5e9;   /* celeste intenso: centros regionales y red principal */
    --c2:#38bdf8;   /* celeste medio: nodos secundarios, límites */
    --c3:#7dd3fc;   /* celeste claro: nodos periféricos */
    --c4:#e0f2fe;   /* celeste casi blanco: destellos */
    --land:rgba(56,189,248,.06);
    width:min(100%,860px);
  }
  #mapa-nodos svg{display:block;width:100%;height:auto;overflow:visible;-webkit-tap-highlight-color:transparent}

  .dep{fill:var(--land);stroke:var(--c2);stroke-opacity:.4;stroke-width:.7px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .cruz{fill:none;stroke:var(--c2);stroke-opacity:.3;stroke-width:.8px;vector-effect:non-scaling-stroke}

  .edge{fill:none;stroke-linecap:butt;transition:opacity .25s}
  .l1{stroke:var(--c1);stroke-width:calc(2px*var(--ks,1));opacity:calc(.85*var(--v,1))}
  .l2{stroke:var(--c2);stroke-width:calc(1.2px*var(--ks,1));opacity:calc(.65*var(--v,1))}
  .l3{stroke:var(--c3);stroke-width:calc(.8px*var(--ks,1));opacity:calc(.6*var(--v,1))}
  .pulso{fill:none;stroke:var(--c2);stroke-linecap:round;opacity:0}
  .punta{fill:#fff;stroke:var(--c1);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:0}
  .cabeza{fill:#fff;stroke:var(--c1);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:0}

  .nodo{opacity:calc(.3 + .7*var(--v,1));transition:opacity .25s;transform-box:fill-box;transform-origin:center;animation:aparece .7s cubic-bezier(.2,.8,.2,1) backwards}
  .n1{fill:var(--c1)} .n2{fill:var(--c2)} .n3{fill:var(--c3)}
  .ng{opacity:var(--v,1);transition:opacity .25s}
  .eco{fill:none;stroke:var(--c2);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:0;transform-box:fill-box;transform-origin:center;animation:eco 5s ease-out infinite}
  .aro{fill:none;stroke:var(--c2);stroke-opacity:.75;stroke-width:1px;stroke-dasharray:2.5 3.5;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:giro 26s linear infinite}
  .sat{fill:var(--c4)}
  .onda{fill:none;stroke:var(--c1);stroke-width:1.3px;vector-effect:non-scaling-stroke;opacity:0}
  .hit{fill:#000;fill-opacity:0;cursor:pointer;outline:none}
  .hit:focus-visible{stroke:var(--c4);stroke-width:1.5px;vector-effect:non-scaling-stroke}

  .foco .edge{opacity:.07}
  .foco .edge.on{opacity:.95}
  .foco .nodo:not(.on),.foco .ng:not(.on){opacity:.2}

  @keyframes aparece{from{transform:scale(0);opacity:0}}
  @keyframes eco{0%{transform:scale(1);opacity:.75}70%,100%{transform:scale(4.2);opacity:0}}
  @keyframes giro{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .nodo,.edge,.l3,.aro{animation:none}
    .eco{display:none}
  }
  .auth-dark #mapa-nodos{
    --c1:#75c4fb;
    --c2:#69a8dc;
    --c3:#4d7fae;
    --c4:#dbeafe;
    --land:rgba(37,99,235,.2);
  }
  .auth-dark .dep{stroke-opacity:.58}
  .auth-dark .cruz{stroke-opacity:.24}
  /* Compact rendering when this standalone map is embedded in the auth panel. */
  @media (max-height:420px){
    body{overflow:hidden;padding:0}
    #mapa-nodos{width:min(100%,360px)}
  }
</style>
</head>

    if (dentro(x, y)) return [x, y];
    for (let r = 1; r < 16; r++) for (let a = 0; a < 16; a++) {
      const nx = x + Math.cos(a * Math.PI / 8) * r, ny = y + Math.sin(a * Math.PI / 8) * r;
      if (dentro(nx, ny)) return [nx, ny];
    }
    return [x, y];
  }

  // lat/lon -> SVG (geoViewBox del archivo, Mercator)
  const [L, T, R, B] = [-87.690700, 15.026288, -82.737853, 10.707073];
  const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  const geoXY = (lat, lon) => [(lon - L) / (R - L) * W, (merc(T) - merc(lat)) / (merc(T) - merc(B)) * H];

  // Cruces de gratícula cada grado (detalle cartográfico)
  let g = '';
  for (let lon = -87; lon <= -83; lon++) for (let lat = 11; lat <= 15; lat++) {
    const [x, y] = geoXY(lat, lon);
    if (x > 0 && x < W && y > 0 && y < H) g += `M${(x - 3).toFixed(1)} ${y.toFixed(1)}H${(x + 3).toFixed(1)}M${x.toFixed(1)} ${(y - 3).toFixed(1)}V${(y + 3).toFixed(1)}`;
  }
  svg.insertBefore(mk('path', { class: 'cruz', d: g }), gMapa);

  // ===== Nodos y enlaces =====
  const gE = mk('g', {}), gP = mk('g', {}), gO = mk('g', {}), gN = mk('g', {}), gL = mk('g', {}), gH = mk('g', {});
  const nodos = {};
  for (const id in DATA) {
    const [nombre, lat, lon, nivel, region] = DATA[id];
    const [x, y] = ajustar(...geoXY(lat, lon));
    nodos[id] = { id, nombre, x, y, nivel, region, edges: [], react: 0 };
  }
  const lista = Object.values(nodos);

  const aristas = ENLACES.map(([a, b], i) => {
    const A = nodos[a], B = nodos[b], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
    const s = (i % 2 ? 1 : -1) * 0.09 * len;                       // curvatura suave
    const qx = (A.x + B.x) / 2 - dy / len * s, qy = (A.y + B.y) / 2 + dx / len * s;
    const d = `M${A.x.toFixed(1)} ${A.y.toFixed(1)}Q${qx.toFixed(1)} ${qy.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}`;
    const lvl = Math.max(A.nivel, B.nivel);
    const el = mk('path', { d, class: 'edge l' + lvl }, gE);
    const e = { a: A, b: B, el, d, lvl, L: el.getTotalLength(), est: 'oculta', f: 0, anc: 0, act: 0, v: 1, t0: 0, dur: 1, tNext: 0 };
    e.punta = mk('circle', { class: 'punta' }, gP);
    A.edges.push(e); B.edges.push(e);
    return e;
  });

  lista.forEach((n, i) => {
    n.g = mk('g', { class: 'ng' }, gO);
    if (n.nivel < 3) {                                   // ecos suaves, más frecuentes en los centros regionales
      n.eco = mk('circle', { class: 'eco', cx: n.x, cy: n.y }, n.g);
      n.eco.style.animationDuration = ((n.nivel === 1 ? 3.4 : 5.5) + Math.random() * 2) + 's';
      n.eco.style.animationDelay = (-Math.random() * 6) + 's';
    }
    n.onda = mk('circle', { class: 'onda', cx: n.x, cy: n.y }, n.g);
    if (n.nivel === 1) {                                 // anillo giratorio y dos satélites
      n.aro = mk('circle', { class: 'aro', cx: n.x, cy: n.y }, n.g);
      if (i % 2) n.aro.style.animationDirection = 'reverse';
      n.sats = [0, Math.PI].map(a => ({ a, el: mk('circle', { class: 'sat' }, n.g) }));
    }
    n.core = mk('circle', { class: 'nodo n' + n.nivel, cx: n.x, cy: n.y }, gN);
    n.core.style.animationDelay = (Math.hypot(n.x - nodos.managua.x, n.y - nodos.managua.y) * 2.2) + 'ms';   // entrada en onda desde Managua
    n.hit = mk('circle', { class: 'hit', cx: n.x, cy: n.y, tabindex: 0, role: 'button', 'aria-label': `${n.nombre}, ${NIVEL[n.nivel]}` }, gH);
  });
  function orbitar(t) {
    for (const n of lista) if (n.sats) n.sats.forEach((s, k) => {
      const a = s.a + t * 0.0009 * (k ? -0.7 : 1), rr = n.r + 4.5 * kr;
      s.el.setAttribute('cx', n.x + Math.cos(a) * rr); s.el.setAttribute('cy', n.y + Math.sin(a) * rr); s.el.setAttribute('r', 1.3 * kr);
    });
  }

  // Tamaños que crecen en pantallas pequeñas para mantener legibilidad
  let kr = 1;
  function escala() {
    const K = Math.min(1.9, Math.max(1, W / (svg.clientWidth || W)));
    kr = 1 + (K - 1) * 0.55;
    raiz.style.setProperty('--ks', (W / (svg.clientWidth || W)).toFixed(3));   // grosor de línea constante en pantalla
    for (const n of lista) {
      n.r = [0, 5.2, 3.4, 1.9][n.nivel] * kr;
      n.core.setAttribute('r', n.r);
      if (n.eco) n.eco.setAttribute('r', n.r + 1);
      if (n.aro) n.aro.setAttribute('r', n.r + 4.5 * kr);
      n.hit.setAttribute('r', Math.max(n.r + 5, 11 * K));
    }
    orbitar(performance.now());
  }
  new ResizeObserver(escala).observe(svg); escala();

  // ===== Zonas de actividad: tres focos lentos recorren todo el país =====
  // Donde pasa un foco, nodos y conexiones se encienden; donde se aleja, se desvanecen.
  const olas = [
    { wx: 0.00015, wy: 0.00019, px: 0.0, py: 1.0, wa: 0.00017, pa: 2.0, s: 105 },
    { wx: 0.00018, wy: 0.00013, px: 2.4, py: 0.3, wa: 0.00014, pa: 4.0, s: 120 },
    { wx: 0.00011, wy: 0.00016, px: 4.1, py: 2.2, wa: 0.00020, pa: 0.5, s: 95 },
    { wx: 0.00013, wy: 0.00010, px: 5.3, py: 4.0, wa: 0.00012, pa: 3.1, s: 90 }
  ];
  function vida(t) {
    const cs = olas.map(o => ({ x: W * (0.5 + 0.46 * Math.sin(t * o.wx + o.px)), y: H * (0.5 + 0.46 * Math.sin(t * o.wy + o.py)),
      a: 0.65 + 0.35 * Math.sin(t * o.wa + o.pa), d2: 2 * o.s * o.s }));
    for (const n of lista) {
      let s = 0; for (const c of cs) { const dx = n.x - c.x, dy = n.y - c.y; s += c.a * Math.exp(-(dx * dx + dy * dy) / c.d2); }
      n.v = 0.1 + 0.9 * (1 - Math.exp(-1.9 * s));
      const v = (n.v * (0.25 + 0.75 * n.lit)).toFixed(3);
      n.g.style.setProperty('--v', v); n.core.style.setProperty('--v', v);
      dibujarNodo(n);
    }
    for (const e of aristas) { e.v = (e.a.v + e.b.v) / 2; e.el.style.setProperty('--v', e.v.toFixed(3)); }
  }

  // ===== Ciclo de vida de las conexiones: crecen, permanecen, se retraen y reaparecen =====
  const HOLD = [0, [7000, 16000], [5000, 12000], [3500, 8000]];   // tiempo visible (ms) según jerarquía
  const FUERA = [0, [3000, 8000], [3500, 10000], [4000, 12000]];    // tiempo oculta (ms)
  const rnd = (a, b) => a + Math.random() * (b - a);
  const suave = p => 0.5 - 0.5 * Math.cos(Math.PI * p);
  function trazar(e) {                                            // dibuja solo el tramo visible de la línea
    const L = e.L, len = e.f * L;
    if (e.est === 'crece' || e.est === 'mengua') {                 // punta luminosa en el extremo libre
      const pt = e.el.getPointAtLength(e.anc ? L - len : len);
      e.punta.setAttribute('cx', pt.x.toFixed(1)); e.punta.setAttribute('cy', pt.y.toFixed(1)); e.punta.setAttribute('r', (1.7 + (3 - e.lvl) * 0.5) * kr);
      e.punta.style.opacity = 0.35 + 0.65 * e.v;
    } else e.punta.style.opacity = 0;
    if (e.f <= 0.001) e.el.setAttribute('stroke-dasharray', `0 ${L * 3}`);
    else if (e.f >= 0.999) e.el.removeAttribute('stroke-dasharray');
    else e.el.setAttribute('stroke-dasharray', `0 ${(e.anc ? L - len : 0).toFixed(1)} ${len.toFixed(1)} ${L * 3}`);
  }
  function ciclos(t, dt) {
    for (const e of aristas) {
      const forzada = enfocadas.has(e);                             // al seleccionar un nodo, sus líneas se muestran
      if (e.est === 'oculta') {
        if (t >= e.tNext || forzada) {
          if (forzada || Math.random() < 0.25 + 0.75 * e.v) {        // reaparece sobre todo donde hay actividad
            Object.assign(e, { est: 'crece', t0: t, dur: 1100 + e.L * 7, anc: Math.random() < 0.5 ? 0 : 1 });
          } else e.tNext = t + rnd(600, 1800);
        }
      } else if (e.est === 'crece') {
        const p = (t - e.t0) / e.dur;
        if (p >= 1) { e.est = 'visible'; e.f = 1; e.tNext = t + rnd(...HOLD[e.lvl]); } else e.f = suave(p);
        trazar(e);
      } else if (e.est === 'visible') {
        if (forzada) e.tNext = Math.max(e.tNext, t + 1500);
        else if (e.act === 0 && t >= e.tNext - (e.v < 0.3 ? 4000 : 0)) {   // se retira antes si la zona se enfría
          Object.assign(e, { est: 'mengua', t0: t, dur: 900 + e.L * 6 });
          if (Math.random() < 0.5) e.anc = 1 - e.anc;                // o se retrae hacia su origen, o la recorre hasta el otro extremo
        }
        trazar(e);
      } else {
        const p = (t - e.t0) / e.dur;
        if (p >= 1) { e.est = 'oculta'; e.f = 0; e.tNext = t + rnd(...FUERA[e.lvl]); } else e.f = 1 - suave(p);
        trazar(e);
      }
    }
    for (const n of lista) n.tl = 0;                                // un nodo se enciende cuando una línea lo alcanza
    for (const e of aristas) if (e.f > 0.01) { if (e.anc === 0 || e.f >= 0.999) e.a.tl = 1; if (e.anc === 1 || e.f >= 0.999) e.b.tl = 1; }
    for (const n of lista) { if (n.tl === 1 && !n.prev) n.react = Math.max(n.react, 0.9); n.prev = n.tl === 1; }   // onda al ser alcanzado
    for (const n of lista) n.lit += (n.tl - n.lit) * Math.min(1, dt / 450);
  }

  // ===== Enfoque / interacción =====
  let fijo = null, sobre = null, activo = null, enfocadas = new Set();
  function aplicar() {
    activo = fijo || sobre;
    const act = new Set(), ar = new Set();
    if (activo) { const n = nodos[activo]; act.add(activo); n.edges.forEach(e => { ar.add(e); act.add(e.a.id); act.add(e.b.id); }); }
    enfocadas = ar;
    svg.classList.toggle('foco', !!activo);
    for (const n of lista) {
      const on = act.has(n.id);
      n.core.classList.toggle('on', on); n.g.classList.toggle('on', on);
    }
    aristas.forEach(e => e.el.classList.toggle('on', ar.has(e)));
  }
  for (const n of lista) {
    n.hit.addEventListener('pointerenter', ev => { if (ev.pointerType === 'mouse') { sobre = n.id; aplicar(); } });
    n.hit.addEventListener('pointerleave', ev => { if (ev.pointerType === 'mouse') { sobre = null; aplicar(); } });
    n.hit.addEventListener('focus', () => { sobre = n.id; aplicar(); });
    n.hit.addEventListener('blur', () => { sobre = null; aplicar(); });
    n.hit.addEventListener('click', () => { fijo = fijo === n.id ? null : n.id; aplicar(); });
    n.hit.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); n.hit.dispatchEvent(new Event('click')); } });
  }
  svg.addEventListener('click', ev => { if (!ev.target.closest('.hit')) { fijo = null; aplicar(); } });
  aplicar();

  // ===== Pulsos que recorren las conexiones =====
  const pulsos = Array.from({ length: 30 }, () => ({ act: false, p: mk('path', { class: 'pulso' }, gP), h: mk('circle', { class: 'cabeza' }, gP) }));
  const VEL = [0, 85, 66, 52];   // unidades del mapa por segundo, según jerarquía
  const elegir = a => a[(Math.random() * a.length) | 0];

  function lanzar(e, dir, hops, t) {
    const q = pulsos.find(x => !x.act); if (!q) return;
    e.act++;
    Object.assign(q, { act: true, e, dir, hops, t0: t, dur: e.L / (VEL[e.lvl] * (0.8 + Math.random() * 0.4)) * 1000,
      seg: 14 + Math.random() * 22, w: (1.6 + Math.random() * 1.4) * kr, destino: dir > 0 ? e.b : e.a });
    q.p.setAttribute('d', e.d);
    q.p.setAttribute('stroke-width', q.w);
    q.p.setAttribute('stroke-dasharray', `${q.seg} ${e.L * 3}`);
    q.h.setAttribute('r', q.w * 1.0);
  }
  function lanzarAleatorio(t) {
    const pool = activo && Math.random() < 0.7 ? nodos[activo].edges : aristas;
    for (let i = 0; i < 8; i++) {                                    // solo nacen pulsos donde hay actividad
      const e = elegir(pool);
      if (e.est === 'visible' && (activo || Math.random() < e.v * e.v * (1.4 - e.lvl * 0.2))) { lanzar(e, Math.random() < 0.5 ? 1 : -1, 1 + ((Math.random() * 4) | 0), t); return; }
    }
  }
  function llegar(q, t) {
    q.act = false; q.e.act--; q.p.style.opacity = 0; q.h.style.opacity = 0;
    const n = q.destino; n.react = 1;
    if (q.hops > 0 && Math.random() < 0.8 * Math.min(1, n.v + 0.2)) {                        // el pulso continúa por otra conexión
      const op = n.edges.filter(e => e !== q.e && e.est === 'visible');
      if (op.length) { let r = Math.random() * op.reduce((s, c) => s + c.v + 0.05, 0); const e = op.find(c => (r -= c.v + 0.05) <= 0) || op[0]; lanzar(e, e.a === n ? 1 : -1, q.hops - 1, t); }
    }
  }
  function dibujarNodo(n) {
    n.core.setAttribute('r', n.r * (0.8 + 0.2 * n.v) * (1 + 0.7 * n.react));
    n.onda.setAttribute('r', n.r + (1 - n.react) * 16 * kr);
    n.onda.style.opacity = n.react * 0.9;
  }

  let raf = 0, ultimo = 0, sig = 0, visible = true;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(64, t - ultimo); ultimo = t;
    if (t > sig) { lanzarAleatorio(t); sig = t + 140 + Math.random() * 320; }
    for (const q of pulsos) {
      if (!q.act) continue;
      const p = (t - q.t0) / q.dur;
      if (p >= 1) { llegar(q, t); continue; }
      const e = q.e, s = p * e.L, pos = q.dir > 0 ? s : e.L - s;
      q.p.setAttribute('stroke-dashoffset', -(q.dir > 0 ? s - q.seg : pos));
      const pt = e.el.getPointAtLength(pos);
      q.h.setAttribute('cx', pt.x); q.h.setAttribute('cy', pt.y);
      const o = Math.min(1, p * 8, (1 - p) * 8) * (activo && !enfocadas.has(e) ? 0.1 : 0.35 + 0.65 * e.v);
      q.p.style.opacity = o * 0.95; q.h.style.opacity = o;
    }
    ciclos(t, dt);
    orbitar(t);
    for (const n of lista) if (n.react > 0) n.react = Math.max(0, n.react - dt / 800);
    vida(t);
  }
  function arrancar() {
    if (raf || reducir.matches || !visible || document.hidden) return;
    ultimo = performance.now(); raf = requestAnimationFrame(frame);
    const vis = aristas.filter(e => e.est === 'visible');
    if (vis.length) for (let i = 0; i < 6; i++) lanzar(elegir(vis), Math.random() < 0.5 ? 1 : -1, 2, ultimo - Math.random() * 600);
  }
  function parar() { cancelAnimationFrame(raf); raf = 0; }
  function sincronizar() {
    if (reducir.matches) { parar(); pulsos.forEach(q => { q.act = false; q.p.style.opacity = 0; q.h.style.opacity = 0; }); lista.forEach(n => { n.react = 0; n.lit = 1; });
      aristas.forEach(e => { e.est = 'visible'; e.f = 1; e.act = 0; e.tNext = performance.now() + 4000; trazar(e); });
      vida(0); }
    else if (visible && !document.hidden) arrancar(); else parar();
  }
  reducir.addEventListener('change', sincronizar);
  document.addEventListener('visibilitychange', sincronizar);
  new IntersectionObserver(([en]) => { visible = en.isIntersecting; sincronizar(); }).observe(svg);
  // Estado inicial mezclado: unas líneas ya visibles, otras por aparecer
  const t0 = performance.now();
  lista.forEach(n => { n.lit = 1; n.v = 1; });
  aristas.forEach(e => {
    if (Math.random() < 0.55) { e.est = 'visible'; e.f = 1; e.tNext = t0 + rnd(0, HOLD[e.lvl][1]); }
    else { e.est = 'oculta'; e.f = 0; e.tNext = t0 + rnd(0, 5000); }
    trazar(e);
  });
  ciclos(t0, 16); lista.forEach(n => { n.lit = n.tl; });
  vida(t0);
  sincronizar();
})();
</script>
</body>
</html>
