<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jinowork · preview de assets auth</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#FCF8F5;font-family:system-ui,sans-serif}
.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;object-fit:cover}
.left{position:relative;background:#1B3A33;color:#fff;padding:60px 8%;overflow:hidden;isolation:isolate}
.left h1{font-size:64px;line-height:1;margin:120px 0 0;position:relative}
.right{position:relative;background:#FCF8F5;padding:60px 8%;overflow:hidden;isolation:isolate}
.right h2{color:#1B3A33;font-size:40px;margin:40px 0 0;position:relative}
.edge{position:absolute;top:0;bottom:0;left:calc(55% - 118px);width:200px;height:100%;z-index:5;pointer-events:none}
.grain{position:fixed;inset:0;background:url(extras/30-grano.svg);pointer-events:none;z-index:9;opacity:.8}
@media(max-width:820px){body{grid-template-columns:1fr}.edge{display:none}}
</style>
<section class="left">
  <img class="layer" src="left/02-resplandor-oscuro.svg" alt="">
  <img class="layer" src="left/01-contornos-oscuros.svg" alt="">
  <img class="layer" src="left/05-orbitas-oscuras.svg" alt="">
  <img class="layer" src="left/04-cerros-jinotega.svg" alt="">
  <img class="layer" src="left/03-ondas-oscuras.svg" alt="">
  <h1>Conectamos talento <span style="color:#E08C74">con oportunidades.</span></h1>
</section>
<section class="right">
  <img class="layer" src="right/11-brillo-rosado.svg" alt="">
  <img class="layer" src="right/10-contornos-claros.svg" alt="">
  <img class="layer" src="right/13-orbitas-claras.svg" alt="">
  <img class="layer" src="right/12-ondas-claras.svg" alt="">
  <h2>Crea tu cuenta en Jinowork</h2>
</section>
<img class="edge" src="divider/20-borde-organico.svg" alt="">
<div class="grain"></div>
</html>
